---
- name: copy file on target hosts
  hosts: localhost
  tasks:

    - debug:
        msg: "{{ ansible_hostname }}"

    - name: Ensure file exist or not 
      command: ls -l /home/ansible/list-PocIP
      register: command_output

    - debug: 
        var: "command_output.stdout"


    - name: copy the file on target hosts
      ansible.builtin.copy:
        src: /home/ansible/list-PocIP
        dest: /tmp
      delegate_to: localhost  
---
- name: Disable IdM users inactive for 30 days
  hosts: all
  gather_facts: true

  vars:
    inactivity_days: 1
    inactivity_seconds: "{{ inactivity_days | int * 86400 }}"

    ipa_admin_user: admin
    ipa_admin_password: "zw@Veg5D3rLvMVT"

  tasks:

    - name: Obtain Kerberos ticket
      expect:
        command: "kinit {{ ipa_admin_user }}"
        responses:
          Password.*: "{{ ipa_admin_password }}"
      no_log: true

    - name: Verify Kerberos ticket
      command: klist
      register: kerberos_ticket
      changed_when: false

    - name: Get all users
      shell: |
        ipa user-find --all --raw | awk '/uid: / {print $2}'
      register: ipa_users
      changed_when: false

    - name: Collect last authentication
      shell: |
        ipa user-status {{ item }} 2>/dev/null | \
        awk -F': ' '/Last successful authentication/ {print $2}'
      loop: "{{ ipa_users.stdout_lines }}"
      register: user_auth
      changed_when: false
      failed_when: false

    - name: Display authentication dates
      debug:
        msg: "{{ item.item }} -> {{ item.stdout | default('Never Logged In') }}"
      loop: "{{ user_auth.results }}"

    - name: Build inactive user list
      set_fact:
        inactive_users: "{{ inactive_users | default([]) + [item.item] }}"
      loop: "{{ user_auth.results }}"
      when:
        - item.item not in ['admin']
        - item.stdout is defined
        - item.stdout != ""
        - item.stdout != "N/A"
        - >
          (
            (ansible_date_time.epoch | int) -
            (
              (item.stdout | to_datetime('%Y%m%d%H%M%SZ')).timestamp() | int
            )
          ) > (inactivity_seconds | int)

    - name: Show inactive users
      debug:
        msg: "User {{ item }} inactive for more than {{ inactivity_days }} days"
      loop: "{{ inactive_users | default([]) }}"

    - name: Disable inactive users
      command: ipa user-disable {{ item }}
      loop: "{{ inactive_users | default([]) }}"
      register: disabled_users
      when: inactive_users is defined

    - name: Display disabled users
      debug:
        msg: "Disabled {{ item.item }}"
      loop: "{{ disabled_users.results | default([]) }}"
      when:
        - item.rc is defined
        - item.rc == 0

    - name: Destroy Kerberos ticket
      command: kdestroy
      changed_when: false
      ignore_errors: true

---
- name: Create tar and distribute
  hosts: all
  tasks:

    - name: Create tar file on control node
      community.general.archive:
        path: /tmp/*.pem
        dest: /tmp/certs.gz
      delegate_to: localhost
      run_once: true

    - name: Copy tar to remote hosts
      ansible.builtin.copy:
        src: /tmp/certs.gz
        dest: /tmp/certs.gz
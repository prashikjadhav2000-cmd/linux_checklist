---
- name: copy file on target hosts
  hosts: all
  become: true
  tasks:    
    - name: check file exist or not
      command: ls -ld /tmp
      
    - name: Copy file with owner and permissions
      ansible.builtin.copy:
        src: /tmp/cert9.pem
        dest: /tmp

